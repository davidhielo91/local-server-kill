<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'" />
    <title>Local Server Kill</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header class="top">
      <h1>Servidores locales</h1>
      <button id="refresh" class="icon-btn" type="button" title="Refrescar" aria-label="Refrescar">
        <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M13.5 8a5.5 5.5 0 1 1-1.6-3.9M13.5 2.5v3h-3" /></svg>
      </button>
    </header>

    <main id="list" aria-live="polite"></main>

    <p id="error" class="error" role="alert" hidden></p>

    <footer class="bottom">
      <span id="count"></span>
      <button id="kill-all" class="kill-all" type="button" hidden>Apagar todos</button>
    </footer>

    <template id="row-template">
      <article class="row">
        <button class="port" type="button"></button>
        <div class="info">
          <p class="framework"></p>
          <p class="project"></p>
          <p class="meta"></p>
          <p class="row-error" hidden></p>
        </div>
        <div class="row-buttons">
          <button class="stop" type="button">Detener</button>
          <button class="more" type="button" aria-expanded="false" title="Más acciones" aria-label="Más acciones">
            <svg viewBox="0 0 16 16" aria-hidden="true"><circle cx="3.5" cy="8" r="1.3" /><circle cx="8" cy="8" r="1.3" /><circle cx="12.5" cy="8" r="1.3" /></svg>
          </button>
        </div>
        <div class="actions" hidden>
          <button type="button" data-action="copy">Copiar URL</button>
          <button type="button" data-action="editor">VS Code</button>
          <button type="button" data-action="folder">Carpeta</button>
          <button type="button" data-action="restart">Reiniciar</button>
        </div>
      </article>
    </template>

    <script type="module" src="app.js"></script>
  </body>
</html>
